syntax = "proto3";

package globalmail.rpc;

option go_package = "globalmail/api/rpc;rpc";

service AccService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

service GameService {
  rpc Login(LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  int64 uid = 1;
  int32 server_id = 2;
}

message LoginResponse {
  string token = 1;
  int64 uid = 2;
  int64 role_id = 3;
  int32 server_id = 4;
  bool is_new_user = 5;
  string expire_at = 6;
}
